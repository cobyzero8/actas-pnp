<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llenar Datos - PNP</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- LIBRERÍAS CDN A PRUEBA DE FALLOS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.11/build/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="container">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <a href="menu.html" style="text-decoration: none; color: var(--primary); font-weight: bold; font-size: 13px;">← Cambiar Delito / Actas</a>
      <button onclick="cerrarSesion()" class="btn btn-secondary" style="width: auto; padding: 4px 8px; font-size: 11px;">Salir</button>
    </div>

    <!-- RESUMEN DE SELECCIÓN DE MENU.HTML -->
    <div style="background: #003366; color: white; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
      <div style="font-size: 11px; text-transform: uppercase; opacity: 0.8;">Presunto Delito Configurado:</div>
      <div id="resumenDelito" style="font-weight: bold; font-size: 13px; margin-top: 2px;">-</div>
      <div id="resumenActasCant" style="font-size: 11px; margin-top: 5px; color: #d4af37;">-</div>
    </div>

    <div id="statusMsg" class="alert-msg"></div>

    <form id="expedienteForm">
      
      <!-- LUGAR Y TIEMPO -->
      <div class="grid">
        <div>
          <label>Distrito</label>
          <input type="text" id="distrito" value="Huanta" required>
        </div>
        <div>
          <label>Provincia</label>
          <input type="text" id="provincia" value="Huanta" required>
        </div>
        <div>
          <label>Región</label>
          <input type="text" id="region" value="Ayacucho" required>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div>
          <label>Hora Inicio</label>
          <input type="time" id="hora1" required>
        </div>
        <div>
          <label>Hora Término</label>
          <input type="time" id="hora2" required>
        </div>
        <div class="full">
          <label>Lugar Exacto de Intervención</label>
          <input type="text" id="lugar" placeholder="Ej: Av. San Martín Cdra. 2" required>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- INTERVENIDO -->
      <div class="grid">
        <div class="full">
          <label>Nombres y Apellidos del Intervenido</label>
          <input type="text" id="intervenido_nombre" placeholder="Nombre completo" required>
        </div>
        <div>
          <label>N° DNI</label>
          <input type="text" id="intervenido_dni" placeholder="N° DNI" required>
        </div>
        <div>
          <label>Edad</label>
          <input type="number" id="edad" placeholder="Edad" required>
        </div>
        <div>
          <label>Dónde Nació</label>
          <input type="text" id="natural" placeholder="Natural de" required>
        </div>
        <div>
          <label>Ocupación</label>
          <input type="text" id="ocupacion" value="Su casa" required>
        </div>
        <div>
          <label>Domicilio</label>
          <input type="text" id="domicilio" placeholder="Dirección actual" required>
        </div>
        <div class="full">
          <label>Persona de Confianza (Asistencia)</label>
          <input type="text" id="asistido_confianza" value="no deseando ser asistido por ninguna persona" required>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- DATOS DEL VEHÍCULO (OPCIONAL) -->
      <div class="grid">
        <div class="full">
          <label style="color: var(--primary);">🚘 Datos Vehiculares (Si aplica)</label>
        </div>
        <div>
          <label>Placa del Vehículo</label>
          <input type="text" id="placa_vehiculo" placeholder="Ej: ABC-123">
        </div>
        <div>
          <label>Marca</label>
          <input type="text" id="marca_vehiculo" placeholder="Ej: Toyota">
        </div>
        <div>
          <label>Modelo</label>
          <input type="text" id="modelo_vehiculo" placeholder="Ej: Yaris">
        </div>
        <div class="full">
          <label>Color / Estado del Vehículo</label>
          <input type="text" id="color_vehiculo" placeholder="Ej: Negro / Regular estado de conservación">
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- REGISTRO DE ESPECIES DINÁMICO -->
      <div class="grid">
        <div class="full">
          <label style="color: var(--primary);">📦 Registro de Especies Incautadas / Halladas</label>
        </div>
        <div>
          <label>01. Drogas / Insumos</label>
          <input type="text" class="especie-field" id="drogas" value="NEGATIVO">
        </div>
        <div>
          <label>02. Moneda Nac / Ext</label>
          <input type="text" class="especie-field" id="moneda" value="NEGATIVO">
        </div>
        <div>
          <label>03. Joyas / Alhajas</label>
          <input type="text" class="especie-field" id="joyas" value="NEGATIVO">
        </div>
        <div>
          <label>04. Armas / Explosivos</label>
          <input type="text" class="especie-field" id="municion" value="NEGATIVO">
        </div>
        <div class="full">
          <label>05. Otros</label>
          <input type="text" class="especie-field" id="otros" value="NEGATIVO">
        </div>

        <!-- DETALLE NARRATIVO (SE MUESTRA SOLO SI HAY ALGO POSITIVO) -->
        <div class="full" id="contenedorPositivo" style="display: none; margin-top: 10px;">
          <label style="color: #d9534f; font-weight: bold;">⚠️ Resultado POSITIVO - Detalle de Hallazgos:</label>
          <textarea id="narrar_positivo" placeholder="Escriba la descripción detallada de las especies incautadas..."></textarea>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- PERSONAL PNP -->
      <div class="grid">
        <div>
          <label>Efectivo Interviniente</label>
          <input type="text" id="personal_interviniente" placeholder="Nombres y Apellidos" required>
        </div>
        <div>
          <label>Grado / CIP</label>
          <div style="display:flex; gap:5px;">
            <input type="text" id="grado" placeholder="Ej: S2" required>
            <input type="text" id="cip" placeholder="SA-32112217" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success" style="margin-top: 20px;">📦 Generar Expediente / Actas (.docx / .zip)</button>
      <button type="button" class="btn btn-secondary" onclick="limpiarPantalla()">Finalizar e Iniciar Nueva Intervención</button>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/word.js"></script>
<script>
  // LÓGICA DINÁMICA DE ESPECIES
  document.addEventListener('DOMContentLoaded', () => {
    const especieFields = document.querySelectorAll('.especie-field');
    const contenedorPositivo = document.getElementById('contenedorPositivo');
    const narrarPositivo = document.getElementById('narrar_positivo');

    function evaluarEspecies() {
      let hallazgos = [];

      especieFields.forEach(field => {
        const val = field.value.trim();
        if (val !== '' && val.toUpperCase() !== 'NEGATIVO') {
          const label = field.previousElementSibling.innerText;
          hallazgos.push(`${label}: ${val}`);
        }
      });

      if (hallazgos.length > 0) {
        contenedorPositivo.style.display = 'block';
        if (narrarPositivo.value === 'NINGUNO' || narrarPositivo.value === '') {
          narrarPositivo.value = "Se encontró lo siguiente: " + hallazgos.join('; ') + ".";
        }
      } else {
        contenedorPositivo.style.display = 'none';
        narrarPositivo.value = "NINGUNO";
      }
    }

    especieFields.forEach(field => {
      field.addEventListener('input', evaluarEspecies);
    });
  });
</script>
</body>
</html>
