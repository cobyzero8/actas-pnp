<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Actas - PNP</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Librerías JS necesarias -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.4/pizzip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="container">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <a href="menu.html" style="text-decoration: none; color: var(--primary); font-weight: bold; font-size: 13px;">← Volver al Menú</a>
      <button onclick="cerrarSesion()" class="btn btn-secondary" style="width: auto; padding: 4px 8px; font-size: 11px;">Salir</button>
    </div>

    <!-- Checklist Interactivo con Casillas (Checkboxes) -->
    <div class="protocol-box" style="background: #eef4fc; border-left: 5px solid var(--primary); padding: 15px; border-radius: 6px; margin-bottom: 15px;">
      <h4 id="protocoloNombre" style="margin: 0 0 5px 0; color: var(--primary);">Selección de Actas para el Expediente</h4>
      <p style="font-size: 12px; margin-bottom: 10px; color: #555;">
        Marca o desmarca las actas que realmente vas a adjuntar en esta intervención:
      </p>
      
      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button type="button" onclick="marcarTodas(true)" style="font-size: 11px; padding: 4px 8px; cursor: pointer;">☑️ Marcar Todas</button>
        <button type="button" onclick="marcarTodas(false)" style="font-size: 11px; padding: 4px 8px; cursor: pointer;">◻️ Desmarcar Todas</button>
      </div>

      <!-- Contenedor dinámico de casillas -->
      <div id="checklistContenedor" style="display: grid; grid-template-columns: 1fr; gap: 8px;"></div>
    </div>

    <div id="statusMsg" class="alert-msg"></div>

    <form id="expedienteForm">
      
      <!-- BUSCADOR DE DELITO -->
      <div class="grid">
        <div class="full">
          <label for="delito" style="color: var(--primary); font-size: 14px;">🔍 Presunto Delito / Motivo de Intervención (Escribe para buscar):</label>
          <input list="delitos_lista" id="delito" placeholder="Escribe para buscar (Ej: Conducción, Lesiones, Hurtos, Violencia...)" style="border: 2px solid var(--primary); font-weight: bold;" required>
          
          <datalist id="delitos_lista">
            <!-- DELITOS CONTRA LA VIDA, EL CUERPO Y LA SALUD -->
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - HOMICIDIO SIMPLE (ART. 106 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - PARRICIDIO (ART. 107 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - HOMICIDIO CALIFICADO / ASESINATO (ART. 108 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - FEMINICIDIO (ART. 108-B CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - SICARIATO (ART. 108-C CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - CONSPIRACIÓN Y OFRECIMIENTO PARA EL SICARIATO (ART. 108-D CP)">

            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - INFANTICIDIO (ART. 110 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - HOMICIDIO CULPOSO (ART. 111 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - AUXILIO O INDUCCIÓN AL SUICIDIO (ART. 113 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - AUTOABORTO (ART. 114 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - ABORTO SIN CONSENTIMIENTO (ART. 115 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - ABORTO AGRAVADO POR LA MUERTE DE LA GESTANTE (ART. 116 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - ABORTO PRETERINTENCIONAL (ART. 118 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - LESIONES GRAVES (ART. 121 CP)">
            <option value="DELITO CONTRA LA VIDA, EL CUERPO Y LA SALUD - LESIONES GRAVES CONTRA MUJERES O INTEGRANTES DEL GRUPO FAMILIAR (ART. 121-B CP)">

            <option value="DELITO CONTRA LA FAMILIA - ALTERACIÓN O SUPRESIÓN DEL ESTADO CIVIL (ART. 143 CP)">
            <option value="DELITO CONTRA LA FAMILIA - OMISIÓN DE ASISTENCIA FAMILIAR (ART. 149 CP)">
            <option value="DELITO CONTRA LA FAMILIA - ABANDONO DE GESTANTE EN SITUACIÓN DE CRÍTICA (ART. 150 CP)">

            <!-- DELITOS CONTRA LA LIBERTAD -->
            <option value="DELITO CONTRA LA LIBERTAD - COACCIÓN (ART. 151 CP)">

            <option value="DELITO CONTRA LA LIBERTAD - VIOLACIÓN DE LA INTIMIDAD / DIFUSIÓN DE IMÁGENES O AUDIOS SEXUALES (ART. 154-B CP)">
            <option value="DELITO CONTRA LA LIBERTAD SEXUAL - VIOLACIÓN SEXUAL (ART. 170 CP)">
            <option value="DELITO CONTRA LA LIBERTAD SEXUAL - VIOLACIÓN DE PERSONA EN INCAPACIDAD DE RESISTENCIA (ART. 172 CP)">
            <option value="DELITO CONTRA LA LIBERTAD SEXUAL - VIOLACIÓN SEXUAL DE MENOR DE EDAD (ART. 173 CP)">
            <option value="DELITO CONTRA LA LIBERTAD SEXUAL - VIOLACIÓN SEXUAL DE PERSONA EN ESTADO DE INCONSCIENCIA (ART. 174 CP)">

            <!-- DELITOS CONTRA EL PATRIMONIO -->

            <option value="DELITO CONTRA EL PATRIMONIO - ESTAFA (ART. 196 CP)">
            <option value="DELITO CONTRA EL PATRIMONIO - ESTAFA AGRAVADA (ART. 196-A CP)">
            <option value="DELITO CONTRA EL PATRIMONIO - DEFRAUDACIÓN (ART. 197 CP)">
            <option value="DELITO CONTRA EL PATRIMONIO - FRAUDE EN LA ADMINISTRACIÓN DE PERSONAS JURÍDICAS (ART. 198 CP)">
            <option value="DELITO CONTRA EL PATRIMONIO - EXTORSIÓN (ART. 200 CP)">
            <option value="DELITO CONTRA EL PATRIMONIO - CHANTAJE (ART. 201 CP)">
            <option value="DELITO CONTRA EL PATRIMONIO - USURPACIÓN (ART. 202 CP)">
            <option value="DELITO CONTRA EL PATRIMONIO - DAÑOS (ART. 205 CP)">

            <!-- DELITOS DE CONFIANZA Y ORDEN ECONÓMICO -->
            <option value="DELITO CONTRA EL ORDEN ECONÓMICO - QUIEBRA FRAUDULENTA (ART. 209 CP)">
            <option value="DELITO CONTRA EL ORDEN ECONÓMICO - ABUSO DEL PODER DE MERCADO (ART. 232 CP)">
            <option value="DELITO CONTRA EL ORDEN ECONÓMICO - ESPECULACIÓN (ART. 234 CP)">
            <option value="DELITO CONTRA EL ORDEN ECONÓMICO - ADULTERACIÓN (ART. 235 CP)">
            <option value="DELITO CONTRA EL ORDEN FINANCIERO - CONCENTRACIÓN CREDITICIA (ART. 244 CP)">
            <option value="DELITO CONTRA EL ORDEN FINANCIERO - INSTITUCIONES FINANCIERAS ILEGALES (ART. 246 CP)">

            <!-- DELITOS CONTRA EL ORDEN MONETARIO Y FE PÚBLICA -->
            <option value="DELITO CONTRA EL ORDEN MONETARIO - FABRICACIÓN Y CIRCULACIÓN DE MONEDA FALSA (ART. 252 CP)">
            <option value="DELITO CONTRA EL ORDEN MONETARIO - ALTERACIÓN DE MONEDA (ART. 253 CP)">
            <option value="DELITO CONTRA LA FE PÚBLICA - FALSIFICACIÓN DE DOCUMENTOS (ART. 427 CP)">
            <option value="DELITO CONTRA LA FE PÚBLICA - FALSEDAD IDEOLÓGICA (ART. 428 CP)">
            <option value="DELITO CONTRA LA FE PÚBLICA - FALSEDAD GENÉRICA (ART. 438 CP)">
            <option value="DELITO CONTRA LA FE PÚBLICA - EXPEDICIÓN DE CERTIFICADO MÉDICO FALSO (ART. 431 CP)">

            <!-- DELITOS CONTRA LA SEGURIDAD PÚBLICA -->
            <option value="DELITO CONTRA LA SEGURIDAD PÚBLICA - PELIGRO COMÚN (ART. 273 CP)">
            <option value="DELITO CONTRA LA SEGURIDAD PÚBLICA - CONDUCCIÓN EN ESTADO DE EBRIEDAD O DROGADICCIÓN (ART. 274 CP)">
            <option value="DELITO CONTRA LA SEGURIDAD PÚBLICA - TENENCIA ILEGAL DE ARMAS Y MUNICIONES (ART. 279 CP)">
            <option value="DELITO CONTRA LA SEGURIDAD PÚBLICA - FABRICACIÓN O TENENCIA DE MATERIAL EXPLOSIVO (ART. 279-A CP)">
            <option value="DELITO CONTRA LA SEGURIDAD PÚBLICA - USO DE ARMAS EN ESTADO DE EBRIEDAD O DROGADICCIÓN (ART. 279-F CP)">
            <option value="DELITO CONTRA LA SALUD PÚBLICA - TRÁFICO ILÍCITO DE DROGAS (ART. 296 CP)">
            <option value="DELITO CONTRA LA SALUD PÚBLICA - FORMACIÓN DE ASOCIACIÓN PARA EL TRÁFICO ILÍCITO DE DROGAS (ART. 296-A CP)">
            <option value="DELITO CONTRA LA SALUD PÚBLICA - COMERCIALIZACIÓN Y CULTIVO DE AMAPOLA Y MARIHUANA (ART. 296-A CP)">
            <option value="DELITO CONTRA LA SALUD PÚBLICA - MICROCOMERCIALIZACIÓN O MICROPRODUCCIÓN DE DROGAS (ART. 298 CP)">
            <option value="DELITO CONTRA LA SALUD PÚBLICA - CONTAMINACIÓN O ADULTERACIÓN DE ALIMENTOS O MEDICINAS (ART. 286 CP)">

            <!-- DELITOS AMBIENTALES -->
            <option value="DELITO AMBIENTAL - CONTAMINACIÓN DEL MEDIO AMBIENTE (ART. 304 CP)">
            <option value="DELITO AMBIENTAL - INCUMPLIMIENTO DE NORMAS DE MANEJO DE RESIDUOS SÓLIDOS (ART. 306 CP)">
            <option value="DELITO AMBIENTAL - MINERÍA ILEGAL (ART. 307-A CP)">
            <option value="DELITO AMBIENTAL - TRÁFICO ILÍCITO DE ESPECIES DE FLORA Y FAUNA SILVESTRE (ART. 308 CP)">
            <option value="DELITO AMBIENTAL - DEPREDACIÓN DE FLORA Y FAUNA SILVESTRE (ART. 308-C CP)">

            <!-- DELITOS CONTRA LA TRANQUILIDAD PÚBLICA -->
            <option value="DELITO CONTRA LA TRANQUILIDAD PÚBLICA - DISTURBIOS (ART. 315 CP)">
            <option value="DELITO CONTRA LA TRANQUILIDAD PÚBLICA - APOLOGÍA DEL DELITO (ART. 316 CP)">
            <option value="DELITO CONTRA LA TRANQUILIDAD PÚBLICA - ORGANIZACIÓN CRIMINAL (ART. 317 CP)">
            <option value="DELITO CONTRA LA TRANQUILIDAD PÚBLICA - BANDA CRIMINAL (ART. 317-B CP)">
            <option value="DELITO CONTRA LA TRANQUILIDAD PÚBLICA - MARCAJE O REGLAJE (ART. 317-A CP)">

            <!-- DELITOS CONTRA LA ADMINISTRACIÓN PÚBLICA -->
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - USURPACIÓN DE FUNCIONES (ART. 361 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - OSTENTACIÓN DE TÍTULOS O HONORES QUE NO CORRESPONDEN (ART. 362 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - VIOLENCIA CONTRA LA AUTORIDAD PARA OBLIGARLA A UN ACTO (ART. 365 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - RESISTENCIA O DESOBEDIENCIA A LA AUTORIDAD (ART. 368 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - INGRESO INDEBIDO DE EQUIPOS O MATERIALES A CENTROS PENITENCIARIOS (ART. 368-A CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - PECULADO DOLOSO Y CULPOSO (ART. 387 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - PECULADO DE USO (ART. 388 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - MALVERSACIÓN DE FONDOS (ART. 389 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - COHECHO PASIVO PROPIO (ART. 393 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN PÚBLICA - COHECHO PASIVO IMPROPIO (ART. 394 CP)">

            <option value="DELITO CONTRA LA ADMINISTRACIÓN DE JUSTICIA - ENCUBRIMIENTO REAL (ART. 405 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN DE JUSTICIA - FALSO TESTIMONIO O FALSA DECLARACIÓN EN PROCEDIMIENTO (ART. 409 CP)">
            <option value="DELITO CONTRA LA ADMINISTRACIÓN DE JUSTICIA - PREVARICATO (ART. 418 CP)">

            <!-- DELITOS CONTRA LA HUMANIDAD Y EL ESTADO -->
            <option value="DELITO CONTRA LA HUMANIDAD - GENOCIDIO (ART. 319 CP)">
            <option value="DELITO CONTRA LA HUMANIDAD - DESAPARICIÓN FORZADA (ART. 320 CP)">
            <option value="DELITO CONTRA LA HUMANIDAD - TORTURA (ART. 321 CP)">

        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- LUGAR Y TIEMPO -->
      <div class="grid">
        <div>
          <label>Distrito</label>
          <input type="text" id="distrito" value="Huanta" required>
        </div>
        <div>
          <label>Provincia / Región</label>
          <input type="text" id="provincia" value="Huanta" required>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div>
          <label>Hora Inicio / Fin</label>
          <div style="display:flex; gap:5px;">
            <input type="time" id="hora1" required>
            <input type="time" id="hora2" required>
          </div>
        </div>
        <div class="full">
          <label>Lugar Exacto de Intervención</label>
          <input type="text" id="lugar" placeholder="Ej: Av. San Martín Cdra. 2" required>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- INTERVENIDO -->
      <div class="grid">
        <div class="full">
          <label>Nombres y Apellidos del Intervenido</label>
          <input type="text" id="intervenido_nombre" placeholder="Nombre completo" required>
        </div>
        <div>
          <label>DNI / Documento</label>
          <input type="text" id="intervenido_dni" placeholder="N° DNI" required>
        </div>
        <div>
          <label>Edad / Origen</label>
          <div style="display:flex; gap:5px;">
            <input type="number" id="edad" placeholder="Edad" required>
            <input type="text" id="natural" placeholder="Natural de" required>
          </div>
        </div>
        <div>
          <label>Ocupación</label>
          <input type="text" id="ocupacion" value="Su casa" required>
        </div>
        <div>
          <label>Domicilio</label>
          <input type="text" id="domicilio" placeholder="Dirección actual" required>
        </div>
        <div class="full">
          <label>Persona de Confianza (Asistencia)</label>
          <input type="text" id="asistido_confianza" value="no deseando ser asistido por ninguna persona" required>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- DATOS DEL VEHÍCULO (OPCIONAL) -->
      <div class="grid">
        <div class="full">
          <label style="color: var(--primary);">🚘 Datos Vehiculares (Si aplica)</label>
        </div>
        <div>
          <label>Placa del Vehículo</label>
          <input type="text" id="placa_vehiculo" placeholder="Ej: ABC-123">
        </div>
        <div>
          <label>Marca / Modelo</label>
          <input type="text" id="marca_vehiculo" placeholder="Ej: Toyota Yaris">
        </div>
        <div class="full">
          <label>Color / Estado del Vehículo</label>
          <input type="text" id="color_vehiculo" placeholder="Ej: Negro / Regular estado de conservación">
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- REGISTRO DE ESPECIES -->
      <div class="grid">
        <div><label>01. Drogas / Insumos</label><input type="text" id="drogas" value="NEGATIVO"></div>
        <div><label>02. Moneda Nac / Ext</label><input type="text" id="moneda" value="NEGATIVO"></div>
        <div><label>03. Joyas / Alhajas</label><input type="text" id="joyas" value="NEGATIVO"></div>
        <div><label>04. Armas / Explosivos</label><input type="text" id="municion" value="NEGATIVO"></div>
        <div class="full"><label>05. Otros</label><input type="text" id="otros" value="NEGATIVO"></div>
        <div class="full"><label>Resultado Positivo (Detalle de hallazgos / Narrativa)</label><textarea id="narrar_positivo">NINGUNO</textarea></div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- PERSONAL PNP -->
      <div class="grid">
        <div>
          <label>Efectivo Interviniente</label>
          <input type="text" id="personal_interviniente" placeholder="Nombres y Apellidos" required>
        </div>
        <div>
          <label>Grado / CIP</label>
          <div style="display:flex; gap:5px;">
            <input type="text" id="grado" placeholder="Ej: S2" required>
            <input type="text" id="cip" placeholder="CIP / OA" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success" style="margin-top: 20px;">📦 Generar Documento / Expediente (.docx / .zip)</button>
