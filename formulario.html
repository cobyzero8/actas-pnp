<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llenar Datos - PNP</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.11/build/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    /* Estilos del Cuadro Flotante (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 15px;
      box-sizing: border-box;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 10px;
      max-width: 480px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .especie-field {
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

<!-- CUADRO FLOTANTE (MODAL) PARA REGISTRO DE HALLAZGO POSITIVO -->
<div id="modalEspecie" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalEspecieTitulo" style="margin-top: 0; color: #003366; font-size: 16px;">
      Registrar Hallazgo Positivo
    </h3>
    
    <div style="margin-bottom: 12px;">
      <label style="font-size: 12px; font-weight: bold; color: #333; display: block; margin-bottom: 4px;">
        1. Especifique qué se encontró (Marca, modelo, cantidad, serie, color, etc.):
      </label>
      <textarea id="modalQueSeEncontro" rows="3" placeholder="Ej: 01 arma de fuego tipo pistola marca Baikal, cal. 380, serie N° 123456" style="width: 100%; box-sizing: border-box; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="font-size: 12px; font-weight: bold; color: #333; display: block; margin-bottom: 4px;">
        2. Especifique dónde y cómo se le encontró exactamente:
      </label>
      <textarea id="modalDondeSeEncontro" rows="3" placeholder="Ej: En el bolsillo derecho del pantalón jean color azul del intervenido, envuelto en una bolsa" style="width: 100%; box-sizing: border-box; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    </div>

    <div style="display: flex; gap: 8px; justify-content: flex-end;">
      <button type="button" class="btn btn-secondary" onclick="cancelarEspecieModal()" style="width: auto; padding: 8px 12px; font-size: 12px;">
        Quitar / Dejar en NEGATIVO
      </button>
      <button type="button" class="btn btn-success" onclick="guardarEspecieModal()" style="width: auto; padding: 8px 14px; font-size: 12px;">
        💾 Guardar Hallazgo
      </button>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <a href="menu.html" style="text-decoration: none; color: var(--primary); font-weight: bold; font-size: 13px;">← Cambiar Delito / Actas</a>
      <button onclick="cerrarSesion()" class="btn btn-secondary" style="width: auto; padding: 4px 8px; font-size: 11px;">Salir</button>
    </div>

    <!-- RESUMEN DE SELECCIÓN -->
    <div style="background: #003366; color: white; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
      <div style="font-size: 11px; text-transform: uppercase; opacity: 0.8;">Presunto Delito Configurado:</div>
      <div id="resumenDelito" style="font-weight: bold; font-size: 13px; margin-top: 2px;">-</div>
      <div id="resumenActasCant" style="font-size: 11px; margin-top: 5px; color: #d4af37;">-</div>
    </div>

    <div id="statusMsg" class="alert-msg"></div>

    <form id="expedienteForm">
      
      <!-- LUGAR Y TIEMPO -->
      <div class="grid">
        <div>
          <label>Distrito</label>
          <input type="text" id="distrito" value="Huanta" required>
        </div>
        <div>
          <label>Provincia</label>
          <input type="text" id="provincia" value="Huanta" required>
        </div>
        <div>
          <label>Región</label>
          <input type="text" id="region" value="Ayacucho" required>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div>
          <label>Hora Inicio</label>
          <input type="time" id="hora1" required>
        </div>
        <div>
          <label>Hora Término</label>
          <input type="time" id="hora2" required>
        </div>
        <div class="full">
          <label>Lugar Exacto de Intervención</label>
          <input type="text" id="lugar" placeholder="Ej: Av. San Martín Cdra. 2" required>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- INTERVENIDO -->
      <div class="grid">
        <div class="full">
          <label>Nombres y Apellidos del Intervenido</label>
          <input type="text" id="intervenido_nombre" placeholder="Nombre completo" required>
        </div>
        <div>
          <label>N° DNI</label>
          <input type="text" id="intervenido_dni" placeholder="N° DNI" required>
        </div>
        <div>
          <label>Edad</label>
          <input type="number" id="edad" placeholder="Edad" required>
        </div>
        <div>
          <label>Dónde Nació</label>
          <input type="text" id="natural" placeholder="Natural de" required>
        </div>
        <div>
          <label>Ocupación</label>
          <input type="text" id="ocupacion" value="Su casa" required>
        </div>
        <div>
          <label>Domicilio</label>
          <input type="text" id="domicilio" placeholder="Dirección actual" required>
        </div>
        <div class="full">
          <label>Persona de Confianza (Asistencia)</label>
          <input type="text" id="asistido_confianza" value="no deseando ser asistido por ninguna persona" required>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- DATOS DEL VEHÍCULO (OPCIONAL) -->
      <div class="grid">
        <div class="full">
          <label style="color: var(--primary);">🚘 Datos Vehiculares (Si aplica)</label>
        </div>
        <div>
          <label>Placa del Vehículo</label>
          <input type="text" id="placa_vehiculo" placeholder="Ej: ABC-123">
        </div>
        <div>
          <label>Marca</label>
          <input type="text" id="marca_vehiculo" placeholder="Ej: Toyota">
        </div>
        <div>
          <label>Modelo</label>
          <input type="text" id="modelo_vehiculo" placeholder="Ej: Yaris">
        </div>
        <div class="full">
          <label>Color / Estado del Vehículo</label>
          <input type="text" id="color_vehiculo" placeholder="Ej: Negro / Regular estado de conservación">
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- REGISTRO DE ESPECIES CON CUADRO FLOTANTE -->
      <div class="grid">
        <div class="full">
          <label style="color: var(--primary); font-weight: bold;">
            📦 Registro de Especies Incautadas / Halladas (Toque para registrar hallazgos):
          </label>
        </div>
        <div>
          <label>01. Drogas / Insumos</label>
          <input type="text" class="especie-field" id="drogas" value="NEGATIVO" readonly onclick="abrirEspecieModal('drogas', '01. Drogas / Insumos')">
        </div>
        <div>
          <label>02. Moneda Nac / Ext</label>
          <input type="text" class="especie-field" id="moneda" value="NEGATIVO" readonly onclick="abrirEspecieModal('moneda', '02. Moneda Nac / Ext')">
        </div>
        <div>
          <label>03. Joyas / Alhajas</label>
          <input type="text" class="especie-field" id="joyas" value="NEGATIVO" readonly onclick="abrirEspecieModal('joyas', '03. Joyas / Alhajas')">
        </div>
        <div>
          <label>04. Armas / Explosivos</label>
          <input type="text" class="especie-field" id="municion" value="NEGATIVO" readonly onclick="abrirEspecieModal('municion', '04. Armas, Municiones y Explosivos')">
        </div>
        <div class="full">
          <label>05. Otros</label>
          <input type="text" class="especie-field" id="otros" value="NEGATIVO" readonly onclick="abrirEspecieModal('otros', '05. Otros Bienes / Especies')">
        </div>

        <!-- RESULTADO POSITIVO AUTOMÁTICO PARA EL WORD -->
        <div class="full" id="contenedorPositivo" style="display: none; margin-top: 10px;">
          <label style="color: #d9534f; font-weight: bold;">⚠️ Resultado POSITIVO - Detalle Integrado:</label>
          <textarea id="narrar_positivo" rows="4" readonly style="font-size: 13px; background: #fff5f5; border: 2px solid #d9534f; font-weight: 500;"></textarea>
        </div>
      </div>

      <hr style="margin: 15px 0;">

      <!-- PERSONAL PNP -->
      <div class="grid">
        <div>
          <label>Efectivo Interviniente</label>
          <input type="text" id="personal_interviniente" placeholder="Nombres y Apellidos" required>
        </div>
        <div>
          <label>Grado / CIP</label>
          <div style="display:flex; gap:5px;">
            <input type="text" id="grado" placeholder="Ej: S2" required>
            <input type="text" id="cip" placeholder="SA-32112217" required>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success" style="margin-top: 20px;">📦 Generar Expediente / Actas (.docx / .zip)</button>
      <button type="button" class="btn btn-secondary" onclick="limpiarPantalla()">Finalizar e Iniciar Nueva Intervención</button>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/word.js"></script>
<script>
  // DICCIONARIO PARA GUARDAR DETALLES DE CADA ESPECIE
  const detallesEspecies = {
    drogas: null,
    moneda: null,
    joyas: null,
    municion: null,
    otros: null
  };

  let campoEspecieActual = null;
  let nombreEspecieActual = "";

  function abrirEspecieModal(fieldId, fieldLabel) {
    campoEspecieActual = fieldId;
    nombreEspecieActual = fieldLabel;

    document.getElementById('modalEspecieTitulo').innerText = `Registrar Hallazgo - ${fieldLabel}`;
    
    const previo = detallesEspecies[fieldId];
    if (previo) {
      document.getElementById('modalQueSeEncontro').value = previo.que || "";
      document.getElementById('modalDondeSeEncontro').value = previo.donde || "";
    } else {
      document.getElementById('modalQueSeEncontro').value = "";
      document.getElementById('modalDondeSeEncontro').value = "";
    }

    document.getElementById('modalEspecie').style.display = 'flex';
    document.getElementById('modalQueSeEncontro').focus();
  }

  function guardarEspecieModal() {
    const que = document.getElementById('modalQueSeEncontro').value.trim();
    const donde = document.getElementById('modalDondeSeEncontro').value.trim();

    if (!que || !donde) {
      alert("⚠️ Debe completar ambos datos obligatorios (qué se encontró y dónde/cómo se encontró).");
      return;
    }

    detallesEspecies[campoEspecieActual] = { que, donde };

    const inputElem = document.getElementById(campoEspecieActual);
    inputElem.value = "POSITIVO";
    inputElem.style.background = "#fee2e2";
    inputElem.style.color = "#991b1b";
    inputElem.style.borderColor = "#991b1b";

    cerrarModalYActualizarNarrativa();
  }

  function cancelarEspecieModal() {
    detallesEspecies[campoEspecieActual] = null;

    const inputElem = document.getElementById(campoEspecieActual);
    inputElem.value = "NEGATIVO";
    inputElem.style.background = "#ffffff";
    inputElem.style.color = "#000000";
    inputElem.style.borderColor = "#cbd5e1";

    cerrarModalYActualizarNarrativa();
  }

  // CADA HALLAZGO APARECERÁ EN UNA LÍNEA INDEPENDIENTE CON UN GUION (-)
  function cerrarModalYActualizarNarrativa() {
    document.getElementById('modalEspecie').style.display = 'none';

    let listaHallazgos = [];

    for (let key in detallesEspecies) {
      const item = detallesEspecies[key];
      if (item) {
        listaHallazgos.push(`- ${item.que}, hallado en ${item.donde}.`);
      }
    }

    const contenedorPositivo = document.getElementById('contenedorPositivo');
    const narrarPositivo = document.getElementById('narrar_positivo');

    if (listaHallazgos.length > 0) {
      contenedorPositivo.style.display = 'block';
      narrarPositivo.value = listaHallazgos.join('\n');
    } else {
      contenedorPositivo.style.display = 'none';
      narrarPositivo.value = "NINGUNO";
    }
  }
</script>
</body>
</html>
