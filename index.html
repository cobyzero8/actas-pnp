<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Sistema de Actas PNP</title>
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- LIBRERÍAS DE SUPABASE Y CONFIGURACIÓN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  
  <style>
    .login-wrapper.loading {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body class="login-page">

<main class="login-wrapper" id="loginWrapper">
  <div class="card login-card">
    <h2 class="header-title">SISTEMA DE ACTAS PNP</h2>
    <p class="sub-title">Comisaría PNP / Control de Patrullaje</p>

    <div id="errorAlert" class="alert-msg alert-danger" style="display: none;"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="email">Correo / CIP Registrado</label>
        <input type="email" id="email" name="email" placeholder="usuario@pnp.gob.pe" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnIngresar" class="btn btn-primary" style="width: 100%;">
        🔐 Ingresar al Sistema
      </button>
    </form>
  </div>
</main>

<script src="js/auth.js"></script>
<script>
  // Detectar si la página se está cargando desde el caché del navegador (botón Atrás)
  window.addEventListener('pageshow', function(event) {
    if (event.persisted || (performance && performance.navigation && performance.navigation.type === 2)) {
      localStorage.removeItem('pnp_user_role');
      sessionStorage.clear();
      window.location.reload();
    }
  });
</script>
</body>
</html>
