<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Sistema de Actas PNP</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">

<main class="login-wrapper">
  <div class="card login-card">
    <h2 class="header-title">SISTEMA DE ACTAS</h2>
    <p class="sub-title">Comisaría PNP / Control de Patrullaje</p>

    <div id="errorAlert" class="alert-msg alert-danger" style="display: none;"></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="email">Correo / CIP Registrado</label>
        <input type="email" id="email" name="email" placeholder="usuario@pnp.gob.pe" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary">Ingresar al Sistema</button>
    </form>
  </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
