<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Sistema de Actas PNP</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container" style="max-width: 400px; margin-top: 50px;">
  <div class="card">
    <h2 class="header-title">SISTEMA DE ACTAS</h2>
    <p class="sub-title">Comisaría PNP / Control de Patrullaje</p>

    <div id="errorAlert" class="alert-msg alert-danger"></div>

    <form id="loginForm">
      <div style="margin-bottom: 15px;">
        <label for="email">Correo / CIP Registrado</label>
        <input type="email" id="email" placeholder="usuario@pnp.gob.pe" required>
      </div>

      <div style="margin-bottom: 20px;">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary">Ingresar al Sistema</button>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
