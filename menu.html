        <button type="button" onclick="marcarTodas(true)" style="font-size: 11px; padding: 4px 8px; cursor: pointer;">☑️ Marcar Todas</button>
        <button type="button" onclick="marcarTodas(false)" style="font-size: 11px; padding: 4px 8px; cursor: pointer;">◻️ Desmarcar Todas</button>
      </div>

  document.addEventListener('DOMContentLoaded', () => {
    // Cargar actas manuales personalizadas si existen en localStorage
    const actasManualesGuardadas = localStorage.getItem('pnp_actas_manuales_custom');
    if (actasManualesGuardadas) {
      try {
        const listaCustom = JSON.parse(actasManualesGuardadas);
        listaCustom.forEach(a => {
          if (!CATALOGO_ACTAS.some(c => c.id === a.id)) {
            CATALOGO_ACTAS.push({
              id: a.id,
              titulo: a.titulo,
              archivo: a.archivo || `plantilla/${a.id}.docx`
            });
          }
        });
      } catch(e) {}
    }

    const contenedorUI = document.getElementById('checklistContenedor');
    contenedorUI.innerHTML = "";

    CATALOGO_ACTAS.forEach((acta, idx) => {
      // Por defecto premarcamos las primeras 5 actas básicas
      const preMarcada = idx < 5 ? 'checked' : '';
      contenedorUI.innerHTML += `
        <label style="display: flex; align-items: center; gap: 10px; font-weight: normal; cursor: pointer; background: #fff; padding: 8px 12px; border-radius: 5px; border: 1px solid #cbd5e1;">
          <input type="checkbox" id="chk_${acta.id}" value="${acta.id}" ${preMarcada} style="width: 18px; height: 18px;">
          <span style="font-size: 13px;">📄 <strong>${acta.titulo}</strong></span>
        </label>
      `;
    });
  });

  function marcarTodas(estado) {
    const checkboxes = document.querySelectorAll('#checklistContenedor input[type="checkbox"]');
    checkboxes.forEach(chk => chk.checked = estado);
  }

  function continuarAlFormulario() {
    const delitoTexto = document.getElementById('delito_input').value.trim();
    if (!delitoTexto) {
      alert("⚠️ Por favor escribe o selecciona el Presunto Delito antes de continuar.");
      return;
    }

    const actasElegidas = [];
    CATALOGO_ACTAS.forEach(acta => {
      const chk = document.getElementById(`chk_${acta.id}`);
      if (chk && chk.checked) actasElegidas.push(acta.id);
    });

    if (actasElegidas.length === 0) {
      alert("⚠️ Debes seleccionar al menos una (01) acta para generar.");
      return;
    }

    const delitoTextoCompleto = MAPA_DELITOS_COMPLETOS[delitoTexto] || delitoTexto;

    localStorage.setItem('pnp_delito_seleccionado', delitoTextoCompleto);
    localStorage.setItem('pnp_actas_seleccionadas', JSON.stringify(actasElegidas));

    window.location.href = 'formulario.html';
  }
