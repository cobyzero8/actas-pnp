  // 2. FUNCIÓN DE CLASIFICACIÓN INTELIGENTE
  function clasificarDelito(delito) {
    const d = delito.toUpperCase();
    if (d.includes("EBRIEDAD")) return "EBRIEDAD";
    if (d.includes("ARMAS") || d.includes("EXPLOSIVO")) return "ARMAS";
    if (d.includes("DROGA") || d.includes("AMAPOLA") || d.includes("MARIHUANA")) return "DROGAS";
    if (d.includes("HURTO") || d.includes("ROBO") || d.includes("ABIGEATO")) return "HURTO_ROBO";
    if (d.includes("RECEPTACIÓN")) return "RECEPTACION";
    if (d.includes("USURPACIÓN") || d.includes("DAÑOS")) return "USURPACION_DANOS";
    if (d.includes("EXTORSIÓN") || d.includes("MARCAJE")) return "EXTORSION";
    if (d.includes("FALSIFICACIÓN") || d.includes("FALSEDAD")) return "FALSIFICACION";
    if (d.includes("MONEDA FALSA") || d.includes("ALTERACIÓN DE MONEDA")) return "MONEDA";
    if (d.includes("LEY 30364") || d.includes("MUJERES O INTEGRANTES")) return "VIOLENCIA_MUJER";
    if (d.includes("LESIONES") && d.includes("CULPOSAS")) return "LESIONES_TRANSITO";
    if (d.includes("HOMICIDIO") || d.includes("FEMINICIDIO") || d.includes("SICARIATO") || d.includes("PARRICIDIO")) return "HOMICIDIO";
    if (d.includes("VIOLACIÓN SEXUAL") || d.includes("TOCAMIENTOS") || d.includes("ACOSO")) return "VIOLACION";
    if (d.includes("SECUESTRO") || d.includes("TRATA")) return "SECUESTRO";
    if (d.includes("RESISTENCIA") || d.includes("VIOLENCIA CONTRA LA AUTORIDAD")) return "RESISTENCIA";
    if (d.includes("COHECHO ACTIVO")) return "COHECHO";
    if (d.includes("REQUISITORIA") || d.includes("IDENTIDAD")) return "REQUISITORIA";
    return "DEFAULT";
  }

    // Renderizado del Catálogo de Actas
    const contenedorUI = document.getElementById('checklistContenedor');
    contenedorUI.innerHTML = "";
    CATALOGO_ACTAS.forEach((acta, idx) => {
      contenedorUI.innerHTML += `
        <label style="display: flex; align-items: center; gap: 10px; font-weight: normal; cursor: pointer; background: #fff; padding: 8px 12px; border-radius: 5px; border: 1px solid #cbd5e1;">
          <input type="checkbox" id="chk_${acta.id}" value="${acta.id}" style="width: 18px; height: 18px;">
          <span style="font-size: 13px;">📄 <strong>${acta.titulo}</strong></span>
        </label>
      `;
    });

    // 3. ESCUCHADOR DE EVENTOS PARA EL INPUT DELITO
    document.getElementById('delito_input').addEventListener('change', function(e) {
      const delitoSeleccionado = e.target.value;
      if (!delitoSeleccionado) return;

      // Verificar si es una opción válida del datalist para no disparar con escritura a medias
      const opciones = Array.from(document.querySelectorAll('#delitos_lista option')).map(opt => opt.value);
      if(opciones.includes(delitoSeleccionado)) {
        aplicarProtocoloPolicial(delitoSeleccionado);
      }
    });
  });

  // 4. LÓGICA DE APLICACIÓN Y RENDERIZADO DEL MODAL
  function aplicarProtocoloPolicial(textoDelito) {
    const categoria = clasificarDelito(textoDelito);
    const protocolo = PROCEDIMIENTOS_PNP[categoria];
    if (!protocolo) return;

    marcarTodas(false); // Limpia selección previa

    document.getElementById('modalSugerenciaDelito').innerText = `Procedimiento: ${textoDelito}`;
    const ulKit = document.getElementById('listaKitBasico');
    const ulEsp = document.getElementById('listaActasEspeciales');
    ulKit.innerHTML = ""; ulEsp.innerHTML = "";

    protocolo.kit.forEach(idActa => {
      const chk = document.getElementById(`chk_${idActa}`);
      if (chk) {
        chk.checked = true;
        ulKit.innerHTML += `<li>${chk.nextElementSibling.innerText}</li>`;
      }
    });

    if (protocolo.especiales.length > 0) {
      protocolo.especiales.forEach(idActa => {
        const chk = document.getElementById(`chk_${idActa}`);
        if (chk) {
          chk.checked = true;
          ulEsp.innerHTML += `<li>${chk.nextElementSibling.innerText}</li>`;
        }
      });
    } else {
      ulEsp.innerHTML = "<li>No se identifican actas estandarizadas adicionales en catálogo.</li>";
    }

    document.getElementById('modalSugerenciaActas').style.display = 'flex';
  }

  function cerrarModalSugerencia() {
    document.getElementById('modalSugerenciaActas').style.display = 'none';
  }

  function marcarTodas(estado) {
    const checkboxes = document.querySelectorAll('#checklistContenedor input[type="checkbox"]');
    checkboxes.forEach(chk => chk.checked = estado);
  }

  function continuarAlFormulario() {
    const delitoTexto = document.getElementById('delito_input').value.trim();
    if (!delitoTexto) {
      alert("⚠️ Por favor escribe o selecciona el Presunto Delito antes de continuar.");
      return;
    }

    const actasElegidas = [];
    CATALOGO_ACTAS.forEach(acta => {
      const chk = document.getElementById(`chk_${acta.id}`);
      if (chk && chk.checked) actasElegidas.push(acta.id);
    });

    if (actasElegidas.length === 0) {
      alert("⚠️ Debes seleccionar al menos una (01) acta para generar.");
      return;
    }

    const delitoTextoCompleto = MAPA_DELITOS_COMPLETOS[delitoTexto] || delitoTexto;
    localStorage.setItem('pnp_delito_seleccionado', delitoTextoCompleto);
    localStorage.setItem('pnp_actas_seleccionadas', JSON.stringify(actasElegidas));
    window.location.href = 'formulario.html';
  }
</script>
</body>
</html>
