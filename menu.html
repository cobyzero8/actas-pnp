<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurar Intervención - PNP</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px;">
      <h2 class="header-title" style="margin: 0; font-size: 18px; text-align: left;">CONFIGURAR INTERVENCIÓN</h2>
      <button onclick="cerrarSesion()" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 11px;">Salir</button>
    </div>

    <!-- PASO 1: SELECCIONAR DELITO -->
    <div style="margin-bottom: 20px;">
      <label for="delito_input" style="color: var(--primary); font-size: 14px; font-weight: bold;">
        1. Busque el Presunto Delito (Opcional si es Acta Independiente):
      </label>
      <input list="delitos_lista" id="delito_input" placeholder="Escribe para buscar delito O deja en blanco..." style="border: 2px solid var(--primary); font-weight: bold; width: 100%; padding: 10px; margin-top: 5px;">
      
      <datalist id="delitos_lista">
        <option value="DILIGENCIA POLICIAL INDEPENDIENTE (S/D)">
        <option value="HOMICIDIO SIMPLE (ART. 106 CP)">
        <option value="PARRICIDIO (ART. 107 CP)">
        <option value="HOMICIDIO CALIFICADO / ASESINATO (ART. 108 CP)">
        <option value="FEMINICIDIO (ART. 108-B CP)">
        <option value="SICARIATO (ART. 108-C CP)">
        <option value="HOMICIDIO CULPOSO (ART. 111 CP)">
        <option value="LESIONES GRAVES (ART. 121 CP)">
        <option value="LESIONES LEVES (ART. 122 CP)">
        <option value="AGRESIONES CONTRA LAS MUJERES O INTEGRANTES DEL GRUPO FAMILIAR (ART. 122-B CP / LEY 30364)">
        <option value="INJURIA (ART. 130 CP)">
        <option value="CALUMNIA (ART. 131 CP)">
        <option value="DIFAMACIÓN (ART. 132 CP)">
        <option value="OMISIÓN DE ASISTENCIA FAMILIAR (ART. 149 CP)">
        <option value="COACCIÓN (ART. 151 CP)">
        <option value="ACOSO (ART. 151-A CP)">
        <option value="SECUESTRO (ART. 152 CP)">
        <option value="TRATA DE PERSONAS (ART. 153 CP)">
        <option value="VIOLACIÓN DE DOMICILIO (ART. 159 CP)">
        <option value="VIOLACIÓN SEXUAL (ART. 170 CP)">
        <option value="VIOLACIÓN SEXUAL DE MENOR DE EDAD (ART. 173 CP)">
        <option value="HURTO SIMPLE (ART. 185 CP)">
        <option value="HURTO AGRAVADO (ART. 186 CP)">
        <option value="ROBO SIMPLE (ART. 188 CP)">
        <option value="ROBO AGRAVADO (ART. 189 CP)">
        <option value="RECEPTACIÓN (ART. 194 CP)">
        <option value="ESTAFA (ART. 196 CP)">
        <option value="EXTORSIÓN (ART. 200 CP)">
        <option value="USURPACIÓN (ART. 202 CP)">
        <option value="DAÑOS (ART. 205 CP)">
        <option value="FALSIFICACIÓN DE DOCUMENTOS (ART. 427 CP)">
        <option value="FALSEDAD GENÉRICA (ART. 438 CP)">
        <option value="CONDUCCIÓN EN ESTADO DE EBRIEDAD O DROGADICCIÓN (ART. 274 CP)">
        <option value="TENENCIA ILEGAL DE ARMAS Y MUNICIONES (ART. 279 CP)">
        <option value="TRÁFICO ILÍCITO DE DROGAS (ART. 296 CP)">
        <option value="MICROCOMERCIALIZACIÓN O MICROPRODUCCIÓN DE DROGAS (ART. 298 CP)">
        <option value="DISTURBIOS (ART. 315 CP)">
        <option value="RESISTENCIA O DESOBEDIENCIA A LA AUTORIDAD (ART. 368 CP)">
        <option value="COHECHO PASIVO PROPIO (ART. 393 CP)">
        <option value="CONTROL DE IDENTIDAD POLICIAL / REQUISITORIA">
      </datalist>
    </div>

    <!-- CONSULTA VEHÍCULO -->
    <div style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 20px;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; color: var(--primary); font-size: 13px;">
        <input type="checkbox" id="chk_incluir_vehiculo_pregunta" onchange="conmutarActaVehicular(this.checked)" style="width: 18px; height: 18px; flex-shrink: 0;">
        <span>🚗 ¿Participaron o se incautaron vehículos en la intervención?</span>
      </label>

      <div id="panel_vehicular_acceso" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #cbd5e1; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <span style="font-size: 12px; color: #475569;">
          Se incluirá el <strong>Acta de Situación Vehicular</strong> en el expediente.
        </span>
        <a href="situacion_vehicular.html" style="background: #0284c7; color: white; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-size: 11px; font-weight: bold; display: inline-block;">
          📋 Rellenar Inspección (IA)
        </a>
      </div>
    </div>

    <!-- PASO 2: CHECKLIST -->
    <div class="protocol-box">
      <label style="color: var(--primary); font-size: 14px; font-weight: bold; display: block; margin-bottom: 8px;">
        2. Seleccione las Actas requeridas:
      </label>

      <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary" onclick="marcarTodas(true)" style="font-size: 11px; padding: 4px 8px; width: auto;">☑️ Marcar Todas</button>
        <button type="button" class="btn btn-secondary" onclick="marcarTodas(false)" style="font-size: 11px; padding: 4px 8px; width: auto;">◻️ Desmarcar Todas</button>
      </div>

      <div id="checklistContenedor" style="display: grid; grid-template-columns: 1fr; gap: 8px;"></div>
    </div>

    <button type="button" class="btn btn-primary" onclick="continuarAlFormulario()" style="padding: 14px; font-size: 15px;">
      ➡️ Continuar a Llenar Datos
    </button>
  </div>
</div>

<!-- MODAL SUGERENCIA -->
<div id="modalSugerenciaActas" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-top: 0; color: #003366; font-size: 17px; border-bottom: 2px solid #0284c7; padding-bottom: 8px;">
      💡 Sugerencia Procedimental PNP
    </h3>
    <p id="modalSugerenciaDelito" style="font-weight: bold; color: #dc2626; margin-bottom: 12px; font-size: 13px;"></p>
    
    <div style="background: #f0fdf4; border-left: 4px solid #22c55e; padding: 10px; margin-bottom: 10px; border-radius: 4px;">
      <strong style="color: #166534; font-size: 12px;">🛡️ Kit Estándar Obligatorio:</strong>
      <ul id="listaKitBasico" style="margin: 5px 0 0 0; padding-left: 20px; font-size: 12px; color: #333;"></ul>
    </div>

    <div style="background: #eff6ff; border-left: 4px solid #3b82f6; padding: 10px; margin-bottom: 10px; border-radius: 4px;">
      <strong style="color: #1e40af; font-size: 12px;">🔍 Actas Especializadas (Agregadas):</strong>
      <ul id="listaActasEspeciales" style="margin: 5px 0 0 0; padding-left: 20px; font-size: 12px; color: #333;"></ul>
    </div>

    <div style="text-align: right; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 15px;">
      <a href="situacion_vehicular.html" id="btnModuloVehicularModal" style="display: none; background: #0284c7; color: white; padding: 8px 12px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 12px;">
        📋 Llenar Inspección Vehicular
      </a>
      <button onclick="cerrarModalSugerencia()" style="background: #003366; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">
        Entendido, continuar
      </button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  const MAPA_DELITOS_COMPLETOS = {
    "CONTROL DE IDENTIDAD POLICIAL / REQUISITORIA": "PROCEDIMIENTO POLICIAL - CONTROL DE IDENTIDAD POLICIAL / REQUISITORIA"
  };

  const CATALOGO_ACTAS = [
    { id: "acta_intervencion", titulo: "01. Acta de Intervención Policial", archivo: "plantilla/acta_intervencion.docx" },
    { id: "acta_registro_personal", titulo: "02. Acta de Registro Personal", archivo: "plantilla/acta_registro_personal.docx" },
    { id: "acta_lectura_derechos", titulo: "03. Acta de Lectura de Derechos", archivo: "plantilla/acta_lectura_derechos.docx" },
    { id: "acta_detencion", titulo: "04. Acta de Detención Policial", archivo: "plantilla/acta_detencion.docx" },
    { id: "acta_buen_trato", titulo: "05. Constancia de Buen Trato e Integridad Física", archivo: "plantilla/acta_buen_trato.docx" },
    { id: "acta_registro_vehicular", titulo: "06. Acta de Registro Vehicular", archivo: "plantilla/acta_registro_vehicular.docx" },
    { id: "acta_inmovilizacion", titulo: "07. Acta de Inmovilización", archivo: "plantilla/acta_inmovilizacion.docx" },
    { id: "acta_incautacion", titulo: "08. Acta de Incautación", archivo: "plantilla/acta_incautacion.docx" },
    { id: "acta_lacrado_cadena_custodia", titulo: "09. Acta de Lacrado y Cadena de Custodia", archivo: "plantilla/acta_lacrado_cadena_custodia.docx" },
    { id: "formato_A-6_rotulo_indicios_evidencias", titulo: "10. Formato A-6 Rótulo de Indicios y Evidencias", archivo: "plantilla/formato_A-6_rotulo_indicios_evidencias.docx" },
    { id: "acta_hallazgo_recojo", titulo: "11. Acta de Hallazgo y Recojo", archivo: "plantilla/acta_hallazgo_recojo.docx" },
    { id: "acta_ocurrencia", titulo: "12. Acta de Ocurrencia", archivo: "plantilla/acta_ocurrencia.docx" },
    { id: "acta_intervencion_control_identidad", titulo: "13. Acta de Intervención y Control de Identidad", archivo: "plantilla/acta_intervencion_control_identidad.docx" },
    { id: "acta_constatacion", titulo: "14. Acta de Constatación", archivo: "plantilla/acta_constatacion.docx" },
    { id: "acta_situacion_vehicular", titulo: "15. Acta de Situación Vehicular", archivo: "plantilla/acta_s_v_vehiculo_mayor.docx" }
  ];

  const PROCEDIMIENTOS_PNP = {
    "EBRIEDAD": { kit: ["acta_intervencion", "acta_registro_personal", "acta_lectura_derechos", "acta_detencion", "acta_buen_trato"], especiales: ["acta_registro_vehicular", "acta_inmovilizacion", "acta_situacion_vehicular"] },
    "ARMAS": { kit: ["acta_intervencion", "acta_registro_personal", "acta_lectura_derechos", "acta_detencion", "acta_buen_trato"], especiales: ["acta_lacrado_cadena_custodia", "formato_A-6_rotulo_indicios_evidencias", "acta_incautacion"] },
    "DROGAS": { kit: ["acta_intervencion", "acta_registro_personal", "acta_lectura_derechos", "acta_detencion", "acta_buen_trato"], especiales: ["acta_lacrado_cadena_custodia", "formato_A-6_rotulo_indicios_evidencias", "acta_incautacion"] },
    "HURTO_ROBO": { kit: ["acta_intervencion", "acta_registro_personal", "acta_lectura_derechos", "acta_detencion", "acta_buen_trato"], especiales: ["acta_lacrado_cadena_custodia", "formato_A-6_rotulo_indicios_evidencias", "acta_incautacion", "acta_situacion_vehicular"] },
    "RECEPTACION": { kit: ["acta_intervencion", "acta_registro_personal", "acta_lectura_derechos", "acta_detencion", "acta_buen_trato"], especiales: ["acta_lacrado_cadena_custodia", "formato_A-6_rotulo_indicios_evidencias", "acta_incautacion", "acta_situacion_vehicular"] },
    "DEFAULT": { kit: ["acta_intervencion", "acta_registro_personal", "acta_lectura_derechos", "acta_detencion", "acta_buen_trato"], especiales: [] }
  };

  function clasificarDelito(delito) {
    const d = delito.toUpperCase();
    if (d.includes("EBRIEDAD")) return "EBRIEDAD";
    if (d.includes("ARMAS") || d.includes("EXPLOSIVO")) return "ARMAS";
    if (d.includes("DROGA") || d.includes("AMAPOLA") || d.includes("MARIHUANA")) return "DROGAS";
    if (d.includes("HURTO") || d.includes("ROBO")) return "HURTO_ROBO";
    if (d.includes("RECEPTACIÓN")) return "RECEPTACION";
    return "DEFAULT";
  }

  document.addEventListener('DOMContentLoaded', () => {
    const contenedorUI = document.getElementById('checklistContenedor');
    contenedorUI.innerHTML = "";
    CATALOGO_ACTAS.forEach((acta) => {
      const esVehicular = acta.id === "acta_situacion_vehicular";
      contenedorUI.innerHTML += `
        <label style="display: flex; align-items: center; gap: 10px; font-weight: normal; cursor: pointer; background: #fff; padding: 8px 12px; border-radius: 5px; border: 1px solid #cbd5e1;">
          <input type="checkbox" id="chk_${acta.id}" value="${acta.id}" onchange="sincronizarCheckboxVehiculo('${acta.id}', this.checked)" style="width: 18px; height: 18px; flex-shrink: 0;">
          <span style="font-size: 13px;">📄 <strong>${acta.titulo}</strong> ${esVehicular ? '<span style="color:#0284c7; font-size:11px;">(4 Vistas / IA)</span>' : ''}</span>
        </label>
      `;
    });

    document.getElementById('delito_input').addEventListener('change', function(e) {
      const delitoSeleccionado = e.target.value;
      if (!delitoSeleccionado) return;
      aplicarProtocoloPolicial(delitoSeleccionado);
    });
  });

  function conmutarActaVehicular(estado) {
    const chkSV = document.getElementById('chk_acta_situacion_vehicular');
    if (chkSV) chkSV.checked = estado;
    const panel = document.getElementById('panel_vehicular_acceso');
    if (panel) panel.style.display = estado ? 'flex' : 'none';
  }

  function sincronizarCheckboxVehiculo(idActa, estado) {
    if (idActa === 'acta_situacion_vehicular') {
      const chkPregunta = document.getElementById('chk_incluir_vehiculo_pregunta');
      if (chkPregunta) chkPregunta.checked = estado;
      const panel = document.getElementById('panel_vehicular_acceso');
      if (panel) panel.style.display = estado ? 'flex' : 'none';
    }
  }

  function aplicarProtocoloPolicial(textoDelito) {
    const categoria = clasificarDelito(textoDelito);
    const protocolo = PROCEDIMIENTOS_PNP[categoria] || PROCEDIMIENTOS_PNP["DEFAULT"];

    marcarTodas(false);

    document.getElementById('modalSugerenciaDelito').innerText = `Procedimiento: ${textoDelito}`;
    const ulKit = document.getElementById('listaKitBasico');
    const ulEsp = document.getElementById('listaActasEspeciales');
    ulKit.innerHTML = ""; ulEsp.innerHTML = "";

    protocolo.kit.forEach(idActa => {
      const chk = document.getElementById(`chk_${idActa}`);
      if (chk) {
        chk.checked = true;
        ulKit.innerHTML += `<li>${chk.nextElementSibling.innerText}</li>`;
      }
    });

    let requiereVehiculo = false;
    if (protocolo.especiales.length > 0) {
      protocolo.especiales.forEach(idActa => {
        const chk = document.getElementById(`chk_${idActa}`);
        if (chk) {
          chk.checked = true;
          ulEsp.innerHTML += `<li>${chk.nextElementSibling.innerText}</li>`;
          if (idActa === 'acta_situacion_vehicular') requiereVehiculo = true;
        }
      });
    } else {
      ulEsp.innerHTML = "<li>No se identifican actas estandarizadas adicionales en catálogo.</li>";
    }

    conmutarActaVehicular(requiereVehiculo);
    const btnModalVehiculo = document.getElementById('btnModuloVehicularModal');
    if (btnModalVehiculo) btnModalVehiculo.style.display = requiereVehiculo ? 'inline-block' : 'none';

    document.getElementById('modalSugerenciaActas').style.display = 'flex';
  }

  function cerrarModalSugerencia() {
    document.getElementById('modalSugerenciaActas').style.display = 'none';
  }

  function marcarTodas(estado) {
    const checkboxes = document.querySelectorAll('#checklistContenedor input[type="checkbox"]');
    checkboxes.forEach(chk => {
      chk.checked = estado;
      sincronizarCheckboxVehiculo(chk.value, estado);
    });
  }

  function continuarAlFormulario() {
    let delitoTexto = document.getElementById('delito_input').value.trim();
    const actasElegidas = [];
    CATALOGO_ACTAS.forEach(acta => {
      const chk = document.getElementById(`chk_${acta.id}`);
      if (chk && chk.checked) actasElegidas.push(acta.id);
    });

    if (actasElegidas.length === 0) {
      alert("⚠️ Debes seleccionar al menos una (01) acta para generar.");
      return;
    }

    if (!delitoTexto) {
      delitoTexto = "DILIGENCIA POLICIAL INDEPENDIENTE";
    }

    const delitoTextoCompleto = MAPA_DELITOS_COMPLETOS[delitoTexto] || delitoTexto;
    localStorage.setItem('pnp_delito_seleccionado', delitoTextoCompleto);
    localStorage.setItem('pnp_actas_seleccionadas', JSON.stringify(actasElegidas));
    window.location.href = 'formulario.html';
  }
</script>
</body>
</html>
