<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner DNI con IA - Prueba</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f9;
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-top: 4px solid #0284c7;
    }
    h2 {
      margin-top: 0;
      color: #003366;
      font-size: 18px;
    }
    p {
      font-size: 13px;
      color: #64748b;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
      font-size: 13px;
    }
    .btn:disabled {
      background: #94a3b8;
    }
    .btn-secondary {
      background: #64748b;
    }
    input[type="file"] {
      margin: 15px 0;
      width: 100%;
      box-sizing: border-box;
    }
    #estado {
      margin-top: 15px;
      font-weight: bold;
      font-size: 13px;
      color: #0369a1;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 Escáner de DNI con IA (Gemini)</h2>
    <p>Toma una foto clara del DNI peruano. Al finalizar, la información se enviará automáticamente a las cajas de texto del formulario.</p>
    
    <input type="file" id="fotoInput" accept="image/*" capture="environment">
    <button type="button" id="btnEscanear" class="btn" onclick="procesarFotoDNI()">🔍 Escanear y Enviar a Formulario</button>
    <button type="button" class="btn btn-secondary" onclick="window.location.href='formulario.html'">⬅️ Cancelar / Volver</button>

    <div id="estado"></div>
  </div>

  <script>
    async function procesarFotoDNI() {
      let apiKey = localStorage.getItem("google_gemini_key") || localStorage.getItem("gemini_api_key");
      
      if (!apiKey) {
        const nuevaKey = prompt("🔑 Ingrese su API Key de Google Gemini AI:");
        if (nuevaKey && nuevaKey.trim() !== "") {
          apiKey = nuevaKey.trim();
          localStorage.setItem("google_gemini_key", apiKey);
          localStorage.setItem("gemini_api_key", apiKey);
        } else {
          alert("⚠️ Se requiere la API Key de Gemini para continuar.");
          return;
        }
      }

      const fileInput = document.getElementById("fotoInput");
      const estadoDiv = document.getElementById("estado");
      const btn = document.getElementById("btnEscanear");

      if (!fileInput.files || !fileInput.files[0]) {
        alert("⚠️ Por favor, selecciona o toma una foto del DNI primero.");
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      estadoDiv.innerText = "⏳ Leyendo DNI con IA de Google...";

      try {
        const base64Data = await extraerBytesBase64(file);

        const promptInstrucciones = `
          Analiza la imagen de este DNI (peruano) y extrae los datos.
          Devuelve ÚNICAMENTE un objeto JSON válido con esta estructura exacta (sin texto ni formato markdown adicional):
          {
              "num_dni": "Número de 8 dígitos",
              "apellidos": "Apellidos completos",
              "nombres": "Nombres completos",
              "fecha_nacimiento": "YYYY-MM-DD",
              "estado_civil": "SOLTERO, CASADO, VIUDO o DIVORCIADO"
          }
          Si un campo no es legible, pon "".
        `;

        const urlAPI = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        const respuesta = await fetch(urlAPI, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptInstrucciones },
                { inline_data: { mime_type: file.type || "image/jpeg", data: base64Data } }
              ]
            }],
            generationConfig: {
              response_mime_type: "application/json"
            }
          })
        });

        const data = await respuesta.json();

        if (data.error) {
          throw new Error(`Google API: ${data.error.message || JSON.stringify(data.error)}`);
        }

        if (!data.candidates || !data.candidates[0]) {
          throw new Error("No se obtuvo respuesta de la imagen. Intenta con otra foto.");
        }

        const textoJSON = data.candidates[0].content.parts[0].text;
        const jsonResultado = JSON.parse(textoJSON);

        // Guardamos la respuesta procesada en la memoria temporal del navegador
        localStorage.setItem('dni_escaneado_temp', JSON.stringify(jsonResultado));

        estadoDiv.innerText = "✅ ¡DNI escaneado con éxito! Redirigiendo...";
        
        setTimeout(() => {
          window.location.href = "formulario.html";
        }, 800);

      } catch (err) {
        console.error(err);
        alert("⚠️ Error al escanear: " + err.message);
        estadoDiv.innerText = "❌ No se pudo procesar la foto.";
      } finally {
        btn.disabled = false;
      }
    }

    function extraerBytesBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
