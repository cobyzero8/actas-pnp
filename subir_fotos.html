<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspección Móvil - PNP</title>

  <!-- LIBRERÍAS Y CONFIGURACIÓN CENTRAL -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 10px;
      color: #0f172a;
    }
    .card-movil {
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 0 auto;
    }
    h2 { color: #003366; font-size: 16px; text-align: center; margin-top: 0; }
    .placa-box { background: #e0f2fe; padding: 8px; border-radius: 6px; margin-bottom: 12px; text-align: center; }
    
    .section-title {
      background: #f8fafc;
      border-left: 4px solid #0284c7;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      color: #0369a1;
      text-transform: uppercase;
      margin: 15px 0 8px 0;
      text-align: left;
    }
    
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 4px;
      text-align: left;
    }
    
    select, textarea, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      font-size: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    
    .select-parte { width: 105px; font-weight: bold; }

    .btn-camara {
      background: #166534;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-enviar-manual {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-camara:disabled, .btn-enviar-manual:disabled { background: #94a3b8; }

    .preview-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .preview-list img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }
  </style>
</head>
<body>

<div class="card-movil">
  <h2>🚓 INSPECCIÓN MÓVIL (COLEGA)</h2>
  <p style="font-size: 11px; color: #475569; text-align: center; margin-bottom: 8px;">Envío de fotos (IA) o llenado manual completo para la PC</p>
  
  <div class="placa-box">
    <strong style="color: #0369a1; font-size: 10px;">VEHÍCULO PLACA:</strong><br>
    <span id="lbl_placa_movil" style="font-size: 15px; font-weight: bold; color: #0284c7;">-</span>
  </div>

  <!-- FOTOS CON IA -->
  <input type="file" id="input_camara" accept="image/*" capture="environment" multiple style="display:none;" onchange="subirFotosASupabase(this.files)">
  <button id="btn_captura" class="btn-camara" onclick="document.getElementById('input_camara').click()">
    📷 Tomar / Subir Fotos (IA)
  </button>
  <div id="galeria_preview" class="preview-list"></div>

  <!-- SELECTOR DE TIPO DE FORMATO EN MÓVIL -->
  <div class="section-title">📌 Tipo de Vehículo / Formato</div>
  <select id="movil_tipo_formato" onchange="cambiarFormatoMovil(this.value)">
    <option value="MAYOR">VEHÍCULO MAYOR (Auto, Camioneta, SUV)</option>
    <option value="MOTOTAXI">VEHÍCULO MENOR: Mototaxi / Trimovil (3 Ruedas)</option>
    <option value="MOTOCICLETA">VEHÍCULO MENOR: Motocicleta / Moto Lineal (2 Ruedas)</option>
  </select>

  <!-- COMBUSTIBLE -->
  <div class="section-title">⛽ Nivel de Combustible</div>
  <select id="movil_combustible">
    <option value="RESERVA (R)">RESERVA (R)</option>
    <option value="1/4 DE TANQUE">1/4 DE TANQUE</option>
    <option value="1/2 TANQUE" selected>1/2 TANQUE</option>
    <option value="3/4 DE TANQUE">3/4 DE TANQUE</option>
    <option value="TANQUE LLENO (1/1)">TANQUE LLENO (1/1)</option>
    <option value="NO ESPECIFICA / INOPERATIVO">NO ESPECIFICA / INOPERATIVO</option>
  </select>

  <!-- SECCIONES DINÁMICAS COMPLETAS -->
  <div id="movil_contenedor_secciones"></div>

  <!-- OBSERVACIONES -->
  <div class="section-title">📝 Observaciones de Campo</div>
  <textarea id="movil_observaciones" placeholder="Escriba aquí daños o detalles detectados..."></textarea>

  <button id="btn_enviar_manual_btn" class="btn-enviar-manual" onclick="enviarInspeccionManualCompleta()">
    🚀 Enviar Todos los Datos a la PC
  </button>

  <p id="lbl_estado_subida" style="font-size: 11px; font-weight: bold; margin-top: 10px; text-align: center;"></p>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const placa = urlParams.get('placa') || 'GENERAL';
  document.getElementById('lbl_placa_movil').innerText = placa;

  // Listas idénticas a la PC
  const MAYOR_SEC_1 = ["FARO GRANDE DELT", "INTERMITENTES", "FAROS POSTERIORES", "BISELES", "LIMPIA PARABRISA", "PARABRISAS", "LUNAS", "ESPEJO EXTERIOR", "ANTENAS", "PARACHOQUES", "LLANTAS", "LLANTAS DE REPUESTO"];
  const MAYOR_SEC_2 = ["TABLERO", "CHAPA CONTACTO", "RADIO MUSICAL", "ENCENDEDOR", "PISOS", "MANIJAS", "CENICEROS", "VASOS", "PARASOLES", "CHAPAS", "CODERAS", "GATA", "LLAVE DE RUEDA", "PARLANTES", "ESPEJO INTERIOR", "ASIENTOS"];
  const MAYOR_SEC_3 = ["BATERIA", "RADIADOR", "ARRANCADOR", "ALTERNADOR", "CARBURADOR", "PURIFICADOR", "DISTRIBUIDOR", "BOBINA", "TAPA DE ACEITE", "BUJÍAS", "CHICOTES", "VARILLA ACEITE"];

  const MENOR_SEC_1 = ["VELOCÍMETRO", "TACÓMETRO", "PALANCA DE CAMBIOS", "FRENO DELANTERO", "EMPUÑADURA DEL ACELERADOR", "INTERRUPTOR CONTROL DE FARO", "PEDAL DEL FRENO TRASERO", "PEDAL DE ARRANQUE", "PALANCA DE EMBRAGUE", "COMUNICADOR DE SEÑALES", "PULSADOR DE LA BOCINA", "PALANCA"];
  const MENOR_SEC_2 = ["FARO DELANTERO", "LUCES DE PELIGRO", "DIRECCIONAL DERECHO", "DIRECCIONAL IZQUIERDO", "LUCES AUXILIARES", "ESPEJO RETROVISOR", "RADIO", "CAJITA DE CD", "BATERÍA"];
  const MENOR_SEC_3 = ["CHUPÓN DE BUJÍA", "BUJÍAS", "CARBURADOR", "TAPA DE ACEITE", "CADENAS"];
  const MENOR_SEC_4 = ["TAPA DEL DEPÓSITO DE COMBUSTIBLE", "PEDAL DE CAMBIOS", "LLANTAS", "TOLDO", "ASIENTOS", "TAPAS LATERALES", "TAPABARRO DELANTERO", "TAPABARRO TRASERO"];

  // Credenciales Supabase
  const supabaseUrl = urlParams.get('surl') || localStorage.getItem('pnp_supabase_url') || (typeof CONFIG !== 'undefined' ? CONFIG.SUPABASE_URL : '');
  const supabaseKey = urlParams.get('skey') || localStorage.getItem('pnp_supabase_anon_key') || (typeof CONFIG !== 'undefined' ? CONFIG.SUPABASE_ANON_KEY : '');
  
  let supabaseClient = null;

  if (supabaseUrl && supabaseKey) {
    localStorage.setItem('pnp_supabase_url', supabaseUrl);
    localStorage.setItem('pnp_supabase_anon_key', supabaseKey);
    supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
  }

  document.addEventListener('DOMContentLoaded', () => {
    cambiarFormatoMovil('MAYOR');
  });

  function cambiarFormatoMovil(tipo) {
    const contenedor = document.getElementById('movil_contenedor_secciones');
    contenedor.innerHTML = "";

    let htmlSecciones = "";
    if (tipo === 'MAYOR') {
      htmlSecciones += generarHTMLGrupo("🚘 I. PARTE EXTERIOR", MAYOR_SEC_1);
      htmlSecciones += generarHTMLGrupo("💺 II. PARTE INTERIOR", MAYOR_SEC_2);
      htmlSecciones += generarHTMLGrupo("⚙️ III. MOTOR Y MECÁNICA", MAYOR_SEC_3);
    } else {
      htmlSecciones += generarHTMLGrupo("🕹️ I. CONTROLES Y MANUBRIO", MENOR_SEC_1);
      htmlSecciones += generarHTMLGrupo("💡 II. LUCES Y SISTEMA ELÉCTRICO", MENOR_SEC_2);
      htmlSecciones += generarHTMLGrupo("⚙️ III. MOTOR Y TRANSMISIÓN", MENOR_SEC_3);
      htmlSecciones += generarHTMLGrupo("🛵 IV. ESTRUCTURA Y ACCESORIOS", MENOR_SEC_4);
    }
    contenedor.innerHTML = htmlSecciones;
  }

  function generarHTMLGrupo(titulo, lista) {
    let html = `<div class="section-title">${titulo}</div>`;
    lista.forEach(item => {
      html += `
        <div class="item-row">
          <span>${item}</span>
          <select class="select-parte" data-nombre="${item}">
            <option value="BUENO">BUENO</option>
            <option value="REGULAR" selected>REGULAR</option>
            <option value="MALO">MALO</option>
            <option value="FALTA">FALTA</option>
          </select>
        </div>
      `;
    });
    return html;
  }

  // SUBIR FOTOS (IA)
  async function subirFotosASupabase(files) {
    if (!files || files.length === 0) return;
    const btn = document.getElementById('btn_captura');
    const estado = document.getElementById('lbl_estado_subida');
    const galeria = document.getElementById('galeria_preview');

    if (!supabaseClient) {
      alert("⚠️ No se detectaron credenciales de Supabase.");
      return;
    }

    btn.disabled = true;
    estado.innerText = "⏳ Subiendo fotos...";
    estado.style.color = "#0369a1";
    galeria.innerHTML = "";

    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileName = `inspecciones/${placa}/${Date.now()}_${i}.jpg`;

        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        galeria.appendChild(img);

        const { error } = await supabaseClient.storage.from('fotos_vehiculos').upload(fileName, file);
        if (error) throw error;
      }

      const channel = supabaseClient.channel('canal_fotos_movil');
      await channel.subscribe();
      await channel.send({
        type: 'broadcast',
        event: 'foto_subida',
        payload: { placa: placa, timestamp: Date.now() }
      });

      await supabaseClient.from('notificaciones_fotos').insert([{ placa: placa, timestamp: new Date().toISOString() }]);

      estado.innerText = "✅ ¡Fotos enviadas con éxito a la PC!";
      estado.style.color = "#166534";
    } catch (err) {
      estado.innerText = `❌ Error: ${err.message}`;
      estado.style.color = "#b91c1c";
    } finally {
      btn.disabled = false;
    }
  }

  // ENVIAR DATOS MANUALES COMPLETOS
  async function enviarInspeccionManualCompleta() {
    const estado = document.getElementById('lbl_estado_subida');
    const btnManual = document.getElementById('btn_enviar_manual_btn');

    if (!supabaseClient) {
      alert("⚠️ No se detectaron credenciales de Supabase.");
      return;
    }

    btnManual.disabled = true;
    estado.innerText = "⏳ Enviando datos manuales a la PC...";
    estado.style.color = "#0369a1";

    try {
      const evaluacionPartes = {};
      document.querySelectorAll('.select-parte').forEach(sel => {
        evaluacionPartes[sel.getAttribute('data-nombre')] = sel.value;
      });

      const paqueteDatos = {
        placa: placa,
        tipo_formato: document.getElementById('movil_tipo_formato').value,
        combustible: document.getElementById('movil_combustible').value,
        partes: evaluacionPartes,
        observaciones: document.getElementById('movil_observaciones').value,
        timestamp: Date.now()
      };

      const channel = supabaseClient.channel('canal_fotos_movil');
      await channel.subscribe();
      
      await channel.send({
        type: 'broadcast',
        event: 'inspeccion_manual_enviada',
        payload: paqueteDatos
      });

      estado.innerText = "✅ ¡Datos manuales aplicados en la PC al instante!";
      estado.style.color = "#166534";
    } catch (err) {
      estado.innerText = `❌ Error al enviar: ${err.message}`;
      estado.style.color = "#b91c1c";
    } finally {
      btnManual.disabled = false;
    }
  }
</script>

</body>
</html>
