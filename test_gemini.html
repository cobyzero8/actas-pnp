<!DOCTYPE html>
<html>
<body>
  <h3>Prueba Aislada con Gemini 3.6 Flash</h3>
  <input type="password" id="key" placeholder="Pega tu API Key de AI Studio" style="width: 300px;">
  <button onclick="probarGemini36()">Probar Conexión</button>
  <pre id="log" style="background: #f4f4f4; padding: 10px; margin-top: 10px;"></pre>

  <script>
    async function probarGemini36() {
      const apiKey = document.getElementById('key').value.trim();
      const log = document.getElementById('log');
      log.innerText = "Enviando petición a gemini-3.6-flash...";

      const endpoints = [
        { ver: 'v1beta', model: 'gemini-3.6-flash' },
        { ver: 'v1', model: 'gemini-3.6-flash' }
      ];

      log.innerText = "";
      for (const ep of endpoints) {
        const url = `https://generativelanguage.googleapis.com/${ep.ver}/models/${ep.model}:generateContent?key=${apiKey}`;
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: "Hola" }] }] })
          });
          const data = await res.json();
          if (res.ok) {
            log.innerText += `✅ ÉXITO con ${ep.ver} + ${ep.model}\nRespuesta: ${data.candidates[0].content.parts[0].text}\n\n`;
          } else {
            log.innerText += `❌ ERROR (${res.status}) con ${ep.ver}: ${data.error?.message || ''}\n\n`;
          }
        } catch (err) {
          log.innerText += `❌ ERROR RED: ${err.message}\n\n`;
        }
      }
    }
  </script>
</body>
</html>
